# Default Configuration for C-RAN DRL Experiments
# Aligned with EARTH model and validated parameters

# ============================================================
# Network Topology
# ============================================================
network:
  n_rrh: 12
  n_ue: 10
  n_bbu: 3
  area_size_m: 1000  # 1km x 1km square
  carrier_freq_ghz: 2.1
  bandwidth_mhz: 10
  noise_power_dbm: -102  # Iqbal et al. (2021), Table 2

# ============================================================
# Channel Model
# ============================================================
channel:
  # path_loss_model/fading_model: aspirational/reserved. cran_env/channel_model.py
  # hardcodes exactly one path-loss formula (log-distance PL0 + 10*n*log10(d/d0),
  # with a COST231-Hata-style intercept but a tunable exponent rather than the
  # full COST231-Hata formula) and one fading process (Rayleigh via complex
  # Gaussian) directly in the equation body, with no branch/selection logic —
  # there is no second implementation to switch to. These keys record which
  # model is in effect but do not currently select between alternatives.
  path_loss_model: "log_distance_cost231_intercept"
  path_loss_exponent: 3.5
  shadowing_std_db: 8.0
  fading_model: "rayleigh"
  correlation_coefficient: 0.9  # Gauss-Markov temporal correlation

# ============================================================
# Traffic Model
# ============================================================
traffic:
  # weekday_urban (default: business peak at 11:00, residential peak at 20:00)
  # or weekend_suburban (flatter daytime, later/lower residential peak) —
  # see cran_env/traffic_model.py and evaluation/generalization.py.
  profile: "weekday_urban"
  base_rate_mbps: 50
  peak_multiplier: 3.0
  burstiness: 0.2  # log-normal sigma

# ============================================================
# Power Model (EARTH Model - Al-Zubaedi 2019)
# ============================================================
power:
  rrh:
    p_active_w: 6.8        # Fathy et al. 2021
    p_sleep_w: 4.3         # Fathy et al. 2021
    p_switch_w: 3.0        # Per mode transition
    pa_efficiency: 0.25    # Power amplifier drain efficiency
    p_max_dbm: 30          # Max transmit power per RRH

  bbu:
    # Verified 2026-08-29 directly against the primary source (uploaded PDF,
    # not merely cited from memory): Al-Zubaedi (2019) Table 3.1
    # "Simulation parameters" gives Static power at BBU = 175 W, Dynamic
    # power at BBU = 250 W, Linear model slope = 0.44 -- an exact match to
    # all three values below. Al-Zubaedi's own linear form (P_BBU = P_stat +
    # delta_p * P_dyn * load) adapts the EARTH project's per-BS-type linear
    # power model (P_in = N_TRX*(P_0 + delta_p*P_out), Auer et al. 2011
    # Table II) to a BBU-pool context -- Auer et al. 2011 is the source of
    # that linear FORM, not of these specific three numeric values (Auer's
    # own Table II has no row matching 175/250/0.44 for any BS type).
    p_stat_w: 175.0        # Static power per active BBU (Al-Zubaedi 2019 Table 3.1)
    p_dyn_w: 250.0         # Dynamic processing power range (Al-Zubaedi 2019 Table 3.1)
    delta_p: 0.44          # Load-dependent power slope parameter (Al-Zubaedi 2019 Table 3.1)
    # max_capacity_gops: aspirational/reserved. compute_bbu_power() takes a
    # load *fraction* in [0,1] (derived from the count of active RRHs), not
    # an absolute GOPS quantity — there is no per-RRH compute-demand model
    # anywhere in this codebase to sum and compare against a GOPS ceiling
    # (docs/equation_code_mapping.md tracks that model as "Pending", not
    # implemented). Not read anywhere today.
    max_capacity_gops: 100   # Max processing capacity per BBU (GOPS)

  fronthaul:
    # pon_type: aspirational/reserved. compute_fronthaul_power() implements
    # exactly one fronthaul model (TWDM-PON: OLT + line cards + ONUs), with
    # no branch for epon/aon — there is no alternate implementation to
    # select. Not read anywhere today.
    pon_type: "twdm"       # twdm, epon, aon
    p_olt_w: 20.0          # No matching row in Al-Zubaedi (2019) Table 3.1 -- unverified against
                           # this source; not otherwise cited (needs validation before thesis use)
    # Verified 2026-08-29 against Al-Zubaedi (2019) Table 3.1: "Power
    # consumption of LC" = 5 W, "Power consumption of ONU" = 10.5 W -- these
    # two values were previously transposed here (p_lc_w was 10.0 and
    # p_onu_active_w was 5.0, i.e. each other's correct value), a
    # transcription error caught only once the primary source PDF was
    # actually checked rather than cited from memory.
    p_lc_w: 5.0            # Per active line card (Al-Zubaedi 2019 Table 3.1)
    p_onu_active_w: 10.5   # Al-Zubaedi 2019 Table 3.1
    p_onu_sleep_w: 0.5     # No matching row in Table 3.1 -- unverified against this source
    wavelength_capacity_gbps: 10  # Aggregate demand capacity per active line card

# ============================================================
# DRL Algorithm
# ============================================================
algorithm:
  name: "branching_mp_dqn"
  max_episodes: 5000
  max_steps_per_episode: 100

  # Replay buffer
  buffer_size: 1000000
  batch_size: 256
  min_buffer_size: 10000   # Start training after N transitions

  # Learning rates
  lr_discrete: 1.0e-4
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4        # Used by the pure-DDPG baseline (agents/ddpg_agent.py)

  # Network architecture (Concept Note Section 10.3: two FC layers, 256/128 units)
  hidden_dims: [256, 128]
  activation: "relu"
  use_layer_norm: true

  gamma: 0.99
  tau: 0.005               # Soft update rate

  # DQN parameters
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995     # Per episode
  policy_delay: 2          # TD3 actor/target-update delay, every N critic updates (Section 12.2)

  # Continuous exploration noise (Section 12.2: Gaussian, sigma=0.1*P_max, decayed)
  continuous_noise_std: 0.1
  continuous_noise_std_end: 0.01

  # Training stability
  gradient_clip_norm: 1.0
  reward_scale: 1.0

# ============================================================
# Reward Function Weights
# ============================================================
reward:
  alpha_energy: 1.0         # Energy consumption weight
  beta_qos: 10.0           # QoS violation penalty (must be large)
  gamma_switch: 0.5         # Switching cost weight
  gamma_fronthaul: 1.0      # Fronthaul power penalty weight (applied to P_FH in kW;
                            # P_FH is typically ~0.05-0.15 kW at this scenario's size,
                            # so this weight keeps the penalty on the same order of
                            # magnitude as EE(t) -- 0.1 made it numerically negligible)
  qos_target_sinr_db: 0     # Minimum SINR threshold

# ============================================================
# Evaluation
# ============================================================
evaluation:
  eval_freq: 100            # Evaluate every N episodes
  n_eval_episodes: 10
  n_random_seeds: 10  # [42, 123, 456, 789, 1011, 1337, 2024, 2718, 3141, 4242] per docs/rules.md Rule 3
  save_checkpoints: true
  checkpoint_freq: 500

# ============================================================
# Logging
# ============================================================
logging:
  use_wandb: true
  wandb_project: "cran-drl-thesis"
  log_freq: 10              # Console progress heartbeat every N episodes,
                             # between the fuller evaluation.eval_freq prints

# ============================================================
# Hardware
# ============================================================
hardware:
  device: "cuda"            # cuda or cpu (falls back to cpu automatically if
                             # no GPU is available; training/*.py read this as
                             # BranchingMPDQN's device default)
  # n_envs/num_workers: aspirational/reserved. No vectorized-environment or
  # DataLoader-worker infrastructure exists in this codebase yet — every
  # training loop (training/train_hybrid.py, train_baselines.py, etc.) is a
  # single synchronous CRANEnv. These keys are placeholders for a future
  # parallel-training implementation and are not read anywhere today.
  n_envs: 1                 # Parallel environments (not yet implemented)
  num_workers: 4            # DataLoader workers (not yet implemented)
