# Default Configuration for C-RAN DRL Experiments
# Aligned with EARTH model and validated parameters

# ============================================================
# Network Topology
# ============================================================
network:
  n_rrh: 12
  n_ue: 10
  n_bbu: 3
  area_size_m: 1000  # 1km x 1km square
  carrier_freq_ghz: 2.1
  bandwidth_mhz: 20
  noise_power_dbm: -114  # per RB

# ============================================================
# Channel Model
# ============================================================
channel:
  path_loss_model: "cost231_hata"
  path_loss_exponent: 3.5
  shadowing_std_db: 8.0
  fading_model: "rayleigh"
  correlation_coefficient: 0.9  # Gauss-Markov temporal correlation

# ============================================================
# Traffic Model
# ============================================================
traffic:
  model: "tidal"
  base_rate_mbps: 50
  peak_multiplier: 3.0
  peak_hours: [9, 10, 11, 14, 15, 16, 17, 19, 20, 21, 22]
  burstiness: 0.2  # log-normal sigma

# ============================================================
# Power Model (EARTH Model - Al-Zubaedi 2019)
# ============================================================
power:
  rrh:
    p_active_w: 6.8        # Fathy et al. 2021
    p_sleep_w: 4.3         # Fathy et al. 2021
    p_switch_w: 3.0        # Per mode transition
    pa_efficiency: 0.25    # Power amplifier drain efficiency
    p_max_dbm: 30          # Max transmit power per RRH

  bbu:
    p_stat_w: 175.0        # Static power per active BBU (EARTH model: Al-Zubaedi 2019 Table 3.1 / Auer et al. 2011)
    p_dyn_w: 250.0         # Dynamic processing power range (EARTH model: Al-Zubaedi 2019)
    delta_p: 0.44          # Load-dependent power slope parameter (EARTH model)
    max_capacity_gops: 100   # Max processing capacity per BBU (GOPS)

  fronthaul:
    pon_type: "twdm"       # twdm, epon, aon
    p_olt_w: 20.0
    p_lc_w: 10.0           # Per active line card
    p_onu_active_w: 5.0
    p_onu_sleep_w: 0.5
    wavelength_capacity_gbps: 10

# ============================================================
# DRL Algorithm
# ============================================================
algorithm:
  name: "branching_mp_dqn"
  max_episodes: 5000
  max_steps_per_episode: 100

  # Replay buffer
  buffer_size: 1000000
  batch_size: 256
  min_buffer_size: 10000   # Start training after N transitions

  # Learning rates
  lr_discrete: 1.0e-4
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  lr_alpha: 1.0e-4         # SAC entropy temperature

  # Network architecture
  hidden_dims: [256, 256]
  activation: "relu"
  use_layer_norm: true

  # SAC parameters
  gamma: 0.99
  tau: 0.005               # Soft update rate
  alpha: 0.2               # Initial entropy temperature
  auto_tune_alpha: true
  target_entropy: "auto"   # -dim(action)

  # DQN parameters
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995     # Per episode
  target_update_freq: 1    # Update target every N critic updates

  # Training stability
  gradient_clip_norm: 1.0
  reward_scale: 1.0

# ============================================================
# Reward Function Weights
# ============================================================
reward:
  alpha_energy: 1.0         # Energy consumption weight
  beta_qos: 10.0           # QoS violation penalty (must be large)
  gamma_switch: 0.5         # Switching cost weight
  qos_target_sinr_db: 0     # Minimum SINR threshold

# ============================================================
# Evaluation
# ============================================================
evaluation:
  eval_freq: 100            # Evaluate every N episodes
  n_eval_episodes: 10
  n_random_seeds: 10  # [42, 123, 456, 789, 1011, 1337, 2024, 2718, 3141, 4242] per docs/rules.md Rule 3
  save_checkpoints: true
  checkpoint_freq: 500

# ============================================================
# Logging
# ============================================================
logging:
  use_wandb: true
  wandb_project: "cran-drl-thesis"
  log_freq: 10              # Log every N steps

# ============================================================
# Hardware
# ============================================================
hardware:
  device: "cuda"            # cuda or cpu
  n_envs: 1                 # Parallel environments (if supported)
  num_workers: 4            # DataLoader workers
