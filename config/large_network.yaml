# Large Network Configuration (50 RRHs, 30 UEs)
# For linear action branching scalability sweeps (Concept Note v2.0 Section 11.2)

network:
  n_rrh: 50
  n_ue: 30
  n_bbu: 10
  area_size_m: 2000
  carrier_freq_ghz: 2.1
  bandwidth_mhz: 10  # Iqbal et al. (2021), Table 2 -- matches default.yaml/small_network.yaml
  noise_power_dbm: -102  # Iqbal et al. (2021), Table 2

power:
  rrh:
    p_active_w: 6.8
    p_sleep_w: 4.3
    p_switch_w: 3.0
    pa_efficiency: 0.25
    p_max_dbm: 30

  bbu:
    p_stat_w: 175.0
    p_dyn_w: 250.0
    delta_p: 0.44

algorithm:
  name: "branching_mp_dqn"
  max_episodes: 1000
  max_steps_per_episode: 100
  buffer_size: 200000
  batch_size: 128
  lr_discrete: 1.0e-4
  lr_actor: 3.0e-4

reward:
  alpha_energy: 1.0
  beta_qos: 10.0
  gamma_switch: 0.5
  gamma_fronthaul: 0.1
  qos_target_sinr_db: 0
