# CSI-robustness degradation curve (Concept Note v4.0 Section 12.5, S3).
#   python run_experiment.py --config experiments/csi_robustness.yaml --seed 42
name: csi_robustness
description: >
  Train the hybrid agent, DDQN, and pure-DDPG under perfect CSI; evaluate
  each under channel-gain noise sigma in {0, 0.01, 0.05, 0.1}.
type: csi_robustness
config: config/default.yaml
methods: [branching_mp_dqn, ddqn, ddpg]
sigmas: [0.0, 0.01, 0.05, 0.1]
episodes: 1000
eval_episodes: 10
seed: 42
save_dir: thesis/figures
